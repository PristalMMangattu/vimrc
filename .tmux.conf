# Set vim mode
set-window-option -g mode-keys vi
set-option -g allow-rename off
set-option -g prefix C-Space
unbind C-b
bind C-Space send-prefix
set -g mouse on

bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys M
bind -n C-WheelUpPane select-pane -t= \; copy-mode -e \; send-keys -M
bind -T copy-mode-vi C-WheelUpPane send-keys -X halfpage-up
bind -T copy-mode-vi C-WheelDownPane send-keys -X halfpage-down
bind -T copy-mode-emacs C-WheelUpPane send-keys -X halfpage-up
bind -T copy-mode-emacs C-WheelDownPane send-keys -X halfpage-down


bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


# To copy, left click and drag to highlight text in yellow,
# once you release left click yellow text will disappear and will automatically be available in clipboard
# Use vim keybindigs in copy mode
setw -g mode-keys vi

# Set escape-time to very samll number for nvim to stop mis-interpretting <ESC> as <ALT> (<ALT> is prepended by <ESC> by default.)
set -sg escape-time 10


# Update default bindings of 'Enter' to also use copy-pipe
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"


# For vim themes to work with tmux
set -g default-terminal "xterm-256color"


# Split Window pane
# Split panes with \ and -
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -a
bind tab last-window
unbind '"'
unbind %


